<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Servicios — Admin SPA M</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/admin.css"/>
</head>
<body>

  <aside class="admin-sidebar">
    <a href="admin-dashboard.html" class="sidebar-logo">🌸 SPA M <span>Panel Admin</span></a>
    <nav class="sidebar-nav">
      <span class="sidebar-section">Principal</span>
      <a href="admin-dashboard.html" class="sidebar-link"><span class="sidebar-icon">📊</span> Dashboard</a>
      <span class="sidebar-section">Gestión</span>
      <a href="admin-turnos.html"    class="sidebar-link"><span class="sidebar-icon">📅</span> Turnos</a>
      <a href="admin-servicios.html" class="sidebar-link active"><span class="sidebar-icon">💆</span> Servicios</a>
      <a href="admin-productos.html" class="sidebar-link"><span class="sidebar-icon">🛍️</span> Productos</a>
      <a href="admin-ofertas.html" class="sidebar-link"><span class="sidebar-icon">🏷️</span> Ofertas</a>
      <span class="sidebar-section">Sitio</span>
      <a href="index.html" class="sidebar-link"><span class="sidebar-icon">🌐</span> Ver sitio</a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="sidebar-avatar">A</div>
        <div><div class="sidebar-user-name">Administrador</div><div class="sidebar-user-role">Admin</div></div>
      </div>
      <button class="sidebar-logout" onclick="cerrarSesion()">Cerrar sesión</button>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <h1 class="topbar-title">Gestión de Servicios</h1>
      <div class="topbar-right">
        <button class="btn-primary" onclick="abrirModalNuevo()">+ Nuevo servicio</button>
      </div>
    </div>

    <div class="admin-content">
      <div class="table-card">
        <div class="table-header">
          <h3 class="table-title">Servicios del spa</h3>
          <div class="table-actions">
            <div class="search-input-wrap">
              <input type="text" id="searchInput" placeholder="Buscar..." oninput="filtrar()"/>
            </div>
          </div>
        </div>
        <table>
          <thead>
            <tr>
              <th>Servicio</th>
              <th>Categoría</th>
              <th>Duración</th>
              <th>Precio</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="serviciosBody"></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- MODAL CREAR / EDITAR -->
  <div class="modal-overlay hidden" id="modalForm">
    <div class="modal">
      <h2 class="modal-title" id="modalFormTitle">Nuevo servicio</h2>
      <input type="hidden" id="editId"/>
      <div class="form-grid form-grid-2">
        <div class="field-group" style="grid-column:1/-1">
          <label>Nombre del servicio</label>
          <input type="text" id="fNombre" placeholder="Ej: Masaje Relajante"/>
          <span class="field-error" id="err-nombre"></span>
        </div>
        <div class="field-group">
          <label>Categoría</label>
          <select id="fCategoria">
            <option>Masajes</option>
            <option>Faciales</option>
            <option>Spa & Relax</option>
            <option>Uñas & Estética</option>
          </select>
        </div>
        <div class="field-group">
          <label>Duración (min)</label>
          <input type="number" id="fDuracion" placeholder="60"/>
          <span class="field-error" id="err-duracion"></span>
        </div>
        <div class="field-group">
          <label>Precio ($)</label>
          <input type="number" id="fPrecio" placeholder="5000"/>
          <span class="field-error" id="err-precio"></span>
        </div>
        <div class="field-group">
          <label>URL de imagen</label>
          <input type="text" id="fImg" placeholder="https://..."/>
        </div>
        <div class="field-group" style="grid-column:1/-1">
          <label>Descripción</label>
          <textarea id="fDesc" placeholder="Descripción del servicio..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-ghost" onclick="cerrarModal('modalForm')">Cancelar</button>
        <button class="btn-primary" onclick="guardarServicio()">Guardar</button>
      </div>
    </div>
  </div>

  <!-- MODAL ELIMINAR -->
  <div class="modal-overlay hidden" id="modalEliminar">
    <div class="modal modal-confirm">
      <div class="modal-confirm-icon">🗑️</div>
      <h2 class="modal-confirm-title">¿Eliminar servicio?</h2>
      <p class="modal-confirm-desc">Esta acción no se puede deshacer.</p>
      <div class="modal-confirm-actions">
        <button class="btn-ghost" onclick="cerrarModal('modalEliminar')">Cancelar</button>
        <button class="btn-danger" onclick="confirmarEliminar()">Eliminar</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="../js/admin-servicios.js"></script>
</body>
</html>
