<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard — Admin SPA M</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/admin.css"/>
  <link rel="stylesheet" href="../css/admin-dashboard.css"/>
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="admin-sidebar">
    <a href="admin-dashboard.html" class="sidebar-logo">🌸 SPA M <span>Panel Admin</span></a>
    <nav class="sidebar-nav">
      <span class="sidebar-section">Principal</span>
      <a href="admin-dashboard.html" class="sidebar-link active"><span class="sidebar-icon">📊</span> Dashboard</a>
      <span class="sidebar-section">Gestión</span>
      <a href="admin-turnos.html"    class="sidebar-link"><span class="sidebar-icon">📅</span> Turnos</a>
      <a href="admin-servicios.html" class="sidebar-link"><span class="sidebar-icon">💆</span> Servicios</a>
      <a href="admin-productos.html" class="sidebar-link"><span class="sidebar-icon">🛍️</span> Productos</a>
      <a href="admin-ofertas.html" class="sidebar-link"><span class="sidebar-icon">🏷️</span> Ofertas</a>
      <span class="sidebar-section">Sitio</span>
      <a href="index.html" class="sidebar-link"><span class="sidebar-icon">🌐</span> Ver sitio</a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="sidebar-avatar">A</div>
        <div>
          <div class="sidebar-user-name">Administrador</div>
          <div class="sidebar-user-role">Admin</div>
        </div>
      </div>
      <button class="sidebar-logout" onclick="cerrarSesion()">Cerrar sesión</button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="admin-main">
    <div class="admin-topbar">
      <h1 class="topbar-title">Dashboard</h1>
      <div class="topbar-right">
        <span class="topbar-date" id="topbarDate"></span>
        <a href="turnos.html" class="btn-primary" target="_blank">+ Nuevo turno</a>
      </div>
    </div>

    <div class="admin-content">

      <!-- STATS -->
      <div class="stats-grid" id="statsGrid"></div>

      <!-- GRILLA INFERIOR -->
      <div class="dash-grid">

        <!-- Turnos recientes -->
        <div class="table-card">
          <div class="table-header">
            <h3 class="table-title">Turnos recientes</h3>
            <a href="admin-turnos.html" class="btn-ghost">Ver todos →</a>
          </div>
          <table>
            <thead>
              <tr>
                <th>Cliente</th>
                <th>Servicio</th>
                <th>Fecha</th>
                <th>Estado</th>
              </tr>
            </thead>
            <tbody id="turnosRecientes"></tbody>
          </table>
        </div>

        <!-- Panel derecho -->
        <div class="dash-right">

          <!-- Servicios más reservados -->
          <div class="table-card">
            <div class="table-header">
              <h3 class="table-title">Más reservados</h3>
            </div>
            <div class="top-servicios" id="topServicios"></div>
          </div>

          <!-- Accesos rápidos -->
          <div class="quick-actions">
            <h3 class="section-label">Accesos rápidos</h3>
            <div class="qa-grid">
              <a href="admin-turnos.html"    class="qa-card"><span>📅</span>Turnos</a>
              <a href="admin-servicios.html" class="qa-card"><span>💆</span>Servicios</a>
              <a href="admin-productos.html" class="qa-card"><span>🛍️</span>Productos</a>
              <a href="index.html" target="_blank" class="qa-card"><span>🌐</span>Ver sitio</a>
            </div>
          </div>

        </div>
      </div>

    </div>
  </main>

  <div class="toast" id="toast"></div>
  <script src="../js/historial.js"></script>
  <script src="../js/admin-dashboard.js"></script>
</body>
</html>
